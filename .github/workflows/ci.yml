name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: patient-navigator/backend

    # Postgres rather than SQLite so the row-locking concurrency tests run
    # instead of being skipped.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: navicare
          POSTGRES_PASSWORD: navicare
          POSTGRES_DB: navicare
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U navicare"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://navicare:navicare@localhost:5432/navicare
      SECRET_KEY: ci-only-not-a-real-secret
      DEBUG: "False"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: patient-navigator/backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt ruff

      - name: Lint
        run: ruff check .

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests
        run: python manage.py test --parallel

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: patient-navigator/frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: patient-navigator/frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build
